<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Cases Notify!
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="home-content">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="welcome-card">
    <h1>Menu inicial</h1>
    <p>Controle os usuários e os tickets do sistema.</p>
  </div>

  <ion-list lines="none" class="menu-list">
    @for (option of menuOptions; track option.title) {
      <ion-item [routerLink]="option.route" button detail="true" class="menu-item">
        <ion-icon [name]="option.icon" slot="start" aria-hidden="true"></ion-icon>

        <ion-label>
          <h2>{{ option.title }}</h2>
        </ion-label>

        @if (option.count !== undefined) {
          <ion-badge color="primary" slot="end">{{ option.count }}</ion-badge>
        }
      </ion-item>
    }
  </ion-list>
</ion-content>
